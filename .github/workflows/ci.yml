name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run skill validator
        run: python3 scripts/validate-skills.py

  test-cli:
    name: Run CLI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run every scripts/test_*.py
        run: |
          set -e
          for f in scripts/test_*.py; do
            echo "::group::$f"
            python3 "$f" -v
            echo "::endgroup::"
          done

  check-version-sync:
    name: Version sync (skills / marketplace / codex / hermes / CLI / tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the exact HEAD tag (if any) is visible — the
          # check also verifies tag == CLI_VERSION per CLAUDE.md
          fetch-depth: 0

      - name: Verify every version location agrees
        run: python3 scripts/check_version_sync.py
