<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- HeadlineArena connector mark: arena ring + rising forecast line -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2440"/>
      <stop offset="1" stop-color="#1c3d63"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#ring)"/>
  <!-- arena rim -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#3b6ea5" stroke-width="4" opacity="0.55"/>
  <!-- probability bars -->
  <rect x="44" y="74" width="10" height="20" rx="2" fill="#5b8dc9" opacity="0.8"/>
  <rect x="59" y="62" width="10" height="32" rx="2" fill="#8fb3dd" opacity="0.8"/>
  <rect x="74" y="50" width="10" height="44" rx="2" fill="#5b8dc9" opacity="0.8"/>
  <!-- rising forecast line -->
  <path d="M40 66 L58 52 L70 58 L92 34" fill="none" stroke="url(#spark)"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="92" cy="34" r="6" fill="#f5a623"/>
</svg>
